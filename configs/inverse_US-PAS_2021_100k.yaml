# 100k epochs Inverse PINN - Long training run
# All optimizations enabled for maximum speed

data:
  npz_path: data/US-PAS_2021-04-01_2021-11-30.npz
  time_key: times
  flux_key: qsurf
  theta_key: smap_sm
  zb_true_key: zb
  flux_path: data/US-PAS_2021-04-01_2021-11-30.npz
  theta_obs_path: data/US-PAS_2021-04-01_2021-11-30.npz
  start_date: "2021-04-01"
  end_date: "2021-11-30"
  interpolate: true
  max_gap_hours: 24

soil:
  theta_s: 0.43
  theta_r: 0.02
  alpha: 3.6
  n: 1.56
  Ks: 2.9e-6
  l: 0.5

physics:
  L: 5.0
  zr: 0.5
  S_max: 0.0
  ic_type: hydrostatic

inverse:
  n_spline_knots: 40
  zb_initial: 0.8
  zb_max: 2.0
  lambda_smooth: 0.01
  lambda_curv: 0.001

network:
  h_net:
    hidden_dim: 32
    num_layers: 3
    activation: tanh

training:
  n_epochs: 100000
  learning_rate: 1.0e-3
  device: auto
  seed: 42

sampling:
  batch_size: 16000
  boundary_ratio: 0.5
  batch_size_flux: 800
  batch_size_theta: 500
  interp_ratio: 0.80
  neighbor_ratio: 0.05
  baseline_ratio: 0.15
  gradient_threshold: 0.7
  power: 2.0
  neighbor_expansion: 2

optimization:
  weight_update_freq: 100000
  weight_lr: 0.5
  use_initial_scales: true
  use_amp: true
  use_multi_gpu: false
  grad_accumulation_steps: 1
  use_all_data_points: true   # Use all data for 100k run
  bc_resample_freq: 100
  use_torch_compile: false
  print_freq: 5000            # Less frequent printing for 100k
  initial_pde_weight: 1.0
  initial_flux_bc_weight: 10.0
  initial_wt_head_weight: 10.0
  initial_data_weight: 200.0
  initial_ic_h_weight: 1.0
  initial_ic_zb_weight: 0.0
  initial_zb_smooth_weight: 0.1
  initial_zb_curv_weight: 0.1
  initial_zb_max_depth_weight: 100.0
  initial_zb_guide_weight: 0.0
  use_lbfgs: false

checkpointing:
  dir: checkpoints_inverse/US-PAS_100k
  freq: 10000
  keep_last_n: 5

output:
  dir: outputs_inverse/US-PAS_100k
