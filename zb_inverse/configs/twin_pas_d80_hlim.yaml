# Twin for US-PAS day 80-110 with the head-limited (HYDRUS system-dependent) surface BC.
# The pure flux BC was inadmissible here (surface dried to h = -5e8 m under 13 mm/d evaporation).
site:
  name: US-PAS
  forcing_npz: /storage/project/r-rbras6-0/jjason3/fem_validation/uploaded_data/forward_sensitivity_lib/data/US-PAS_2021-04-01_2021-11-30.npz

soil:            # calibrated Florida set (CLAUDE.md)
  theta_s: 0.43
  theta_r: 0.02
  alpha: 3.6
  n: 1.56
  Ks: 2.9e-6
  l: 0.5
  Ss: 1.0e-5
  blend_width_m: 0.02
  abs_smooth_m: 1.0e-3

scaling:
  L: 2.0

window:
  start: '2021-06-20'
  n_days: 30

zb_spline:
  knot_days: 5.0
  zb_min: 0.05

reference:
  n_nodes: 801
  grid_gamma: 1.5
  rtol: 1.0e-6
  atol: 1.0e-9
  max_step_hours: 1.0
  out_dt_hours: 1.0
  h_crit_m: -100.0            # minimum surface head (HYDRUS hCritA = 1e4 cm)
  crit_width: 0.1             # gate width in log|h|
  h_surf_admissible_m: -150.0

obs:
  depth_m: 0.05
  interval_hours: 24

ident:
  sigmas: [0.005, 0.01, 0.02]

output:
  dir: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/output/twin_pas_d80_hlim
