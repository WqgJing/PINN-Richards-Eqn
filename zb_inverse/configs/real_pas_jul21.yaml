# Real data, CYCLE window (drying, re-wetting, drying): US-PAS, 29 Jul - 7 Aug 2021 (scripts/make_real.py;
# tasks/todo.md findings 73 bl, 73 bm). Calibration window of the cycle tests of 7 Aug and 25 Aug 2021.
# Rain in true time (record stamped 23.5 h late, checked event by event against the well, 28 Jul - 30 Aug):
#   no half-hour above 0.3 mm from 28 Jul 12:00 to 3 Aug 07:30: water table down to 0.91 m, sensor to 18.0 %
#   3 Aug 07:30 - 17:30   12 mm in two spells: water table 0.91 -> 0.50 m, sensor 18.0 -> 21.1 %
#   4 Aug 00:30 - 10:00   23 mm, 9 mm of it in half an hour: water table -> 0.23 m, sensor -> 39.3 %
# then a recession until the end of the window.
# Same set-up as configs/real_pas_oct21.yaml except for what rain needs (as configs/real_ona_rain21.yaml):
#   forcing.node_hours 1    the bursts last 30 - 60 min; daily nodes would spread them over two days
#   zb_spline.knot_days 1   the water table rises within the hour of the rain
#   given    half-hourly LE (-> ET), rain, soil moisture SWC_1_1_1 (TDR at 0.10 m below the surface)
#   truth    half-hourly water-table depth WTD_1_1_1 (scoring / calibration only)
# Soil: calibrated Florida set (CLAUDE.md) as the starting soil; replaced by --set soil.* for a calibrated one.
site:
  name: US-PAS
  amf_csv: /storage/project/r-rbras6-0/jjason3/fem_validation/uploaded_data/AMF_US-PAS_BASE-BADM_2-5/AMF_US-PAS_BASE_HH_2-5.csv
  columns: {le: LE, p: P_RAIN_1_1_1, wtd: WTD_1_1_1, swc: SWC_1_1_1}
  p_shift_hours: -23.5        # rain record stamped 23.5 h late at this site, Aug-Dec 2021 (tasks/todo.md finding 68 d)
  gldas_csv: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/data/gldas_G02101_2015_2024.csv

forcing:
  node_hours: 1
  fill_half_window_days: 7    # mean-diurnal-cycle filling of missing LE
  transpiration_fraction: gldas
  check_fractions: [0.0, 0.5, 1.0]

fem:                          # as configs/twin_gldas_fl.yaml (forward check and scoring only)
  root: /storage/project/r-rbras6-0/jjason3/wtd_pipeline
  L: 12.0
  n_nodes: 101
  max_iter: 50
  tol: 1.0e-5
  omega: 0.5
  dt_hours: 1.0
  check_dt_hours: 0.25
  check_n_nodes: 201

soil:
  theta_s: 0.43
  theta_r: 0.02
  alpha: 3.6
  n: 1.56
  Ks: 2.9e-6
  l: 0.5
  Ss: 1.0e-5
  blend_width_m: 0.02
  abs_smooth_m: 1.0e-3

scaling:
  L: 2.0

window:
  start: '2021-07-29T12:00'
  n_days: 9

zb_spline:
  knot_days: 1.0
  zb_min: 0.05

reference:
  h_surf_admissible_m: -10.0

obs:
  depth_m: [0.10, 0.10]       # point sensor
  interval_hours: 24
  max_gap_hours: 3

truth:
  max_gap_hours: 3

output:
  dir: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/output/real_pas_jul21
