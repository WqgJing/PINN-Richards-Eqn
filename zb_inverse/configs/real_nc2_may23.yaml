# Real data, third site: US-NC2 (AmeriFlux, loblolly pine plantation on drained organic soil, NC coastal plain;
# harvested 2020, young regrowth in 2023), recession of 1 - 16 May 2023 (tasks/todo.md finding 73 aq).
# Water table 0.29 -> 0.73 m, soil moisture 0.495 -> 0.398; 3.6 mm of rain on 9 May, next rain 17 May.
# Calibration window of the test of 1 Sep 2023 (configs/real_nc2_sep23a.yaml).
# Same set-up as configs/real_pas_oct21.yaml (scripts/make_real.py); site, sensor and window differ.
#   given    half-hourly LE_1_1_1 (-> ET), rain P_1_1_1, soil moisture SWC_1_1_1: rods from the surface to 0.30 m
#            (the reading falls while the water table is still above 0.30 m), taken as the mean over 0 - 0.30 m
#   truth    half-hourly water-table depth WTD_1_1_1 (scoring / calibration only)
# The window starts at local noon: the daily forcing nodes are then calendar-day means, placed at noon.
# Transpiration fraction: GLDAS ratio T_p / (E_soil + T_p) of the nearest pixel in the project's GLDAS tables
# (USGS well 354227076232901, 27 km east), T_p as the root sink. Rain record: no time shift (rain and the rise of
# the water table coincide in 2023).
# Soil: calibrated US-NC2 set (CLAUDE.md) as the starting soil; replaced by --set soil.* for a calibrated one.
site:
  name: US-NC2
  amf_csv: /storage/project/r-rbras6-0/jjason3/fem_validation/uploaded_data/AMF_US-NC2_BASE-BADM_19-5/AMF_US-NC2_BASE_HH_19-5.csv
  columns: {le: LE_1_1_1, p: P_1_1_1, wtd: WTD_1_1_1, swc: SWC_1_1_1}
  gldas_csv: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/data/gldas_well354227076232901_2015_2024.csv

forcing:
  node_hours: 24
  fill_half_window_days: 7    # mean-diurnal-cycle filling of missing LE
  transpiration_fraction: gldas
  check_fractions: [0.0, 0.5, 1.0]

fem:                          # as configs/twin_gldas_fl.yaml (forward check and scoring only)
  root: /storage/project/r-rbras6-0/jjason3/wtd_pipeline
  L: 12.0
  n_nodes: 101
  max_iter: 50
  tol: 1.0e-5
  omega: 0.5
  dt_hours: 1.0
  check_dt_hours: 0.25
  check_n_nodes: 201

soil:
  theta_s: 0.60
  theta_r: 0.10
  alpha: 2.0
  n: 1.45
  Ks: 5.0e-6
  l: 0.5
  Ss: 1.0e-5
  blend_width_m: 0.02
  abs_smooth_m: 1.0e-3

scaling:
  L: 2.0

window:
  start: '2023-05-01T12:00'
  n_days: 15

zb_spline:
  knot_days: 5.0
  zb_min: 0.05

reference:
  h_surf_admissible_m: -10.0

obs:
  depth_m: [0.0, 0.30]        # mean over the layer 0 - 0.30 m (vertical rods)
  interval_hours: 24
  max_gap_hours: 3

truth:
  max_gap_hours: 3

output:
  dir: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/output/real_nc2_may23
