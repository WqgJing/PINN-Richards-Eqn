# Real data, CYCLE window (drying, re-wetting, drying): US-NC2, 18 - 30 Sep 2023 (scripts/make_real.py;
# tasks/todo.md finding 73 bq). Water table 0.68 -> 0.78 m; 170 mm in 22 h from 22 Sep 10:30 (up to 16 mm per half
# hour) lift it to 0.107 m; recession to 0.40 m. Sensor 39.4 -> 37.7 -> 55.7 -> 45.9 %. Known before any run: the
# well is shallower than 0.20 m for about 2 days and the sensor is on its plateau (55.5 %) for about 1 day.
# Rain and the rise of the well coincide (no shift).
# Same set-up as configs/real_nc2_sep23b.yaml except for what rain needs (as configs/real_pas_jul21.yaml):
#   forcing.node_hours 1    the bursts last 30 - 60 min
#   zb_spline.knot_days 1   the water table rises within the hour of the rain
site:
  name: US-NC2
  amf_csv: /storage/project/r-rbras6-0/jjason3/fem_validation/uploaded_data/AMF_US-NC2_BASE-BADM_19-5/AMF_US-NC2_BASE_HH_19-5.csv
  columns: {le: LE_1_1_1, p: P_1_1_1, wtd: WTD_1_1_1, swc: SWC_1_1_1}
  gldas_csv: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/data/gldas_well354227076232901_2015_2024.csv

forcing:
  node_hours: 1
  fill_half_window_days: 7    # mean-diurnal-cycle filling of missing LE
  transpiration_fraction: gldas
  check_fractions: [0.0, 0.5, 1.0]

fem:                          # as configs/twin_gldas_fl.yaml (forward check and scoring only)
  root: /storage/project/r-rbras6-0/jjason3/wtd_pipeline
  L: 12.0
  n_nodes: 101
  max_iter: 50
  tol: 1.0e-5
  omega: 0.5
  dt_hours: 1.0
  check_dt_hours: 0.25
  check_n_nodes: 201

soil:
  theta_s: 0.60
  theta_r: 0.10
  alpha: 2.0
  n: 1.45
  Ks: 5.0e-6
  l: 0.5
  Ss: 1.0e-5
  blend_width_m: 0.02
  abs_smooth_m: 1.0e-3

scaling:
  L: 2.0

window:
  start: '2023-09-18T12:00'
  n_days: 12

zb_spline:
  knot_days: 1.0
  zb_min: 0.05

reference:
  h_surf_admissible_m: -10.0

obs:
  depth_m: [0.0, 0.30]        # mean over the layer 0 - 0.30 m (vertical rods)
  interval_hours: 24
  max_gap_hours: 3

truth:
  max_gap_hours: 3

output:
  dir: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/output/real_nc2_sep23d
