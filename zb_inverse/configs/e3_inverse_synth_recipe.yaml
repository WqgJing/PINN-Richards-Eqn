# Recommended inverse PINN recipe (2026-11-09), synthetic v3 twin (air-entry soil, sinusoidal forcing).
# = the fixed-sigma baseline (v3_e3_fixed_noise005) plus three changes, each tested on its own:
#   1. sigmas.pde auto now measures the SIGNAL (day means minus known noise; train.signal_rate_scale).
#      The old hourly estimator measured the noise: PDE term 256x weaker at sigma 0.005 -> zb 5.9 cm.
#   2. lr_zb = network lr (1e-3 -> 1e-5): zb no faster than the network can re-solve the physics.
#   3. zb pre-fit after stage 1 (frozen-network Gauss-Newton on the 9 coefficients + physics re-solve):
#      a poor start no longer sends the run into a physics-violating state (deep start 1.0 m: 9.7 m -> 1.0 cm).
#   Long schedule (60k joint Adam + 8k L-BFGS): zb 1.1-1.7 cm -> 0.86-0.89 cm at noise 0.005.
# Noise level: --set obs.noise_sigma=... --set sigmas.theta=... (sigma_theta = the known noise level).
twin_npz: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/output/twin_synth_v3/twin.npz
mode: inverse
obs:
  depth_m: 0.05
  use: hourly
  noise_sigma: 0.005
  q_noise_frac: 0.05
zb_init:
  kind: hydrostatic
  zb_max: 3.0
model:
  width: 64
  depth: 5
  fourier_periods_days: [2, 4, 8, 16, 32, 64]
  tau_ic_days: 0.25
  base: current
sigmas:
  theta: 0.005
  q_frac: 0.1
  pde: auto
weighting:
  mode: fixed
  freq: 100
  alpha: 0.9
  causal: false
  n_chunks: 16
  eps: 0.05
  eps_max: 5.0
sampling:
  rar: {enabled: true, k: 1.0, c: 1.0, pool_factor: 8}
train:
  seed: 0
  n_col: 4096
  n_bc: 512
  resample_every: 100
  frac_rain_t: 0.3
  stage1_steps: 5000
  zb_prefit: {enabled: true, outer: 5, resolve_steps: 1000, delta: 0.01, lambda0: 0.01, max_step: 1.0}
  stage2_steps: 60000
  lr: 1.0e-3
  lr_final: 1.0e-5
  lr_zb: 1.0e-3
  lr_zb_final: 1.0e-5
  clip: 1000.0
  lbfgs_iters: 8000
  lbfgs_n_col: 16384
  lbfgs_n_bc: 2048
  lbfgs_chunk: 100
  log_every: 500
output:
  dir: /storage/project/r-rbras6-0/jjason3/pinn/zb_inverse/runs/recipe_noise005
